[package]
name = "interstice-ml"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Core dependencies
interstice-core = { path = "../interstice-core" }
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12.4"
rand = "0.9.2"
rand_distr = "0.5.1"
approx = "0.5.1"
bytes = "1.10.1"
ordered-float = "5.0.0"
md5 = "0.8.0"
futures = "0.3.31"
humantime-serde = "1.1.1"
prometheus = "0.14.0"
warp = { version = "0.4.2", features = ["server"] }
reqwest = "0.12.23"
tempfile = "3.21.0"
sha2 = "0.10.9"
flate2 = "1.1.2"
zstd = "0.13.3"
lz4_flex = "0.11.5"
aws-config = "1.8.6"
aws-sdk-s3 = "1.104.0"
bincode = "2.0.1"
regex = "1.11.2"
pathbuf = "1.0.0"
once_cell = "1.19.0"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "json"] }
pgvector = { version = "0.4", features = ["sqlx", "serde"] }

# ML dependencies
candle-core = "0.9.1"
candle-nn = "0.9.1"
candle-transformers = "0.9.1"
tokenizers = "0.15"
ort = "1.16.3" 
ndarray = "0.15.6"
hf-hub = "0.4.3"
lru = "0.16.0"
safetensors = "0.6.2"
dashmap = "5.5.3"
num_cpus = "1.17.0"

