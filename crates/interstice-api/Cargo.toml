[package]
name = "interstice-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "interstice-api"
path = "src/main.rs"

[dependencies]
# Internal crates
interstice-core = { path = "../interstice-core" }
interstice-adapters = { path = "../interstice-adapters" }

# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Add these
dotenv = "0.15"
http = "1.0"  # For HeaderMap