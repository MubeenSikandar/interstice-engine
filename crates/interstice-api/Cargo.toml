[package]
name = "interstice-api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "interstice-api"
path = "src/main.rs"

[dependencies]
# Internal crates
interstice-core = { path = "../interstice-core" }
interstice-adapters = { path = "../interstice-adapters" }
interstice-ml = { path = "../interstice-ml" }

# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
slack-morphism = {workspace = true}
uuid = {workspace = true}
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "migrate"] }
async-trait = {workspace = true}

# Add these
dotenv = "0.15"
http = "1.0"  # For HeaderMap
serde_urlencoded = "0.7"
reqwest = { version = "0.11", features = ["json"] }
rustls = { version = "0.23", features = ["ring"] }
base64 = "0.22.1"
urlencoding = "2.1.3"
sys-info = "0.9"
rand = "0.9.2"
sha2 = "0.10.9"
jsonwebtoken = "9.3.1"
hmac = "0.12.1"
once_cell = "1.21.3"
regex = "1.11.2"