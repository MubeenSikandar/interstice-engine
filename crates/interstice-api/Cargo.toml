[package]
name = "interstice-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "interstice-api"
path = "src/main.rs"

[dependencies]
# Internal crates
interstice-core = { path = "../interstice-core" }
interstice-adapters = { path = "../interstice-adapters" }
